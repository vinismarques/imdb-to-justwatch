[project]
name = "imdb-to-justwatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors, including E501 against line-length
    "F",       # pyflakes
    "I",       # import sorting
    "PLC0415", # import-outside-top-level
]

[tool.ty.environment]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
